#user html;
worker_processes  1;
daemon off;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    types_hash_max_size 4096;

    sendfile        on;
    keepalive_timeout  65;

    server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /config/nginx/html;
        index  index.html index.htm;
    }

    location /adsb {
        # Try local dump1090 first (via Tailscale)
        # Note: dump1090 returns all aircraft within antenna range (no radius filtering)
        # Typical range is 30-50nm at jump altitudes, already suitable for operations
        proxy_pass http://100.92.158.48/dump1090/data/aircraft.json;

        # Fast timeout to quickly fallback if local is down
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;

        # Fallback to adsb.lol on any error
        proxy_intercept_errors on;
        error_page 500 502 503 504 404 = @adsb_fallback;

        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location @adsb_fallback {
        # Fallback to adsb.lol API (30nm radius)
        internal;
        proxy_pass https://api.adsb.lol/v2/point/42.703153/-87.958641/30;

        proxy_http_version 1.1;
        proxy_set_header Host api.adsb.lol;
        proxy_set_header X-Real-IP $remote_addr;

        # Longer timeout for external API
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    error_page   500 503  /50x.html;
    location = /50x.html {
        root   /config/nginx/html;
    }
}
}